version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: codigo-gps-backend
    ports:
      - "8001:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Volume for local development (optional, enabled by default for portfolio review)
    volumes:
      - ./backend:/app/backend
      - .:/project
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: codigo-gps-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
