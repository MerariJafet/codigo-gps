[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codigo-gps"
version = "0.1.0"
description = "Motor de análisis y visualización de grafos de código para CÓDIGO GPS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.30.0",
    "pydantic~=2.8.0",
    "networkx~=3.1"
]

[project.scripts]
codigo-gps = "codigo_gps.backend.cli:main"

[tool.setuptools.packages.find]
include = ["codigo_gps*"]
exclude = ["codigo_gps.frontend*"]
